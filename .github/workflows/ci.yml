# Verify, then build and publish the image.
#
# One checkout: the service is self-contained, so there is no sibling repository to
# arrange and no shared module to resolve.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Formatting
        run: |
          # internal/pb is generated by protoc, which formats it its own way.
          unformatted=$(gofmt -s -l . | grep -v '^internal/pb/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Module graph
        run: |
          go mod verify
          go mod tidy
          # A dirty go.mod after tidy means the committed dependency set does not match
          # the imports, which is how a build works on one machine only.
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck $(go list ./... | grep -v '/internal/pb/')

      - name: Tests
        # -race is not optional here: the design rests on concurrent money movement being
        # safe, and a data race would invalidate the tests that prove it.
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -25

  integration:
    runs-on: ubuntu-latest
    # Real Postgres, because the properties under test — FOR UPDATE row locks, the
    # append-only trigger, the CHECK constraints — do not exist in a fake.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arcadia
          POSTGRES_PASSWORD: arcadia
          POSTGRES_DB: arcadia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arcadia"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://arcadia:arcadia@localhost:5432/arcadia_test?sslmode=disable
        # No-ops when the repository has no ./test directory.
        run: |
          if [ -d test ]; then
            go test -race -count=1 -tags=integration ./test/...
          else
            echo "no integration suite in this repository"
          fi

  image:
    runs-on: ubuntu-latest
    needs: [verify, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # A pull request gets its image built — proving the Dockerfile still works — but
          # never pushed.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to arcadia
    runs-on: ubuntu-latest
    needs: [image]
    # Only a real push to main gets rolled out — not a PR build, not a tag build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure kubectl credentials
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.ARCADIA_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # `set image` wouldn't trigger a rollout here: the tag is always :latest, so
      # the pod template's image string never changes. `rollout restart` forces new
      # pods regardless, and imagePullPolicy: Always (the default for :latest) means
      # they pull the image this workflow just pushed.
      - name: Roll out wallet-service
        run: |
          kubectl -n arcadia rollout restart deployment/wallet-service
          kubectl -n arcadia rollout status deployment/wallet-service --timeout=180s
