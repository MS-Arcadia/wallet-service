# Wallet service pipeline: verify, then build and publish an image.
#
# The one unusual step is checking out two repositories. This service depends on the
# shared platform module in the infra repository through a `replace` directive pointing
# at a sibling checkout, so the runner needs both side by side for anything to compile.
# Once the platform module is published under a tag, the second checkout and the
# `replace` directive both disappear.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run: on a busy branch there is no value in finishing a build for a
# commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wallet-service

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the service
        uses: actions/checkout@v4
        with:
          path: wallet-service
          fetch-depth: 0

      - name: Check out the shared platform module
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/infra
          path: infra
          # A read-only token for the sibling repository. Omit it and the checkout fails
          # on a private organisation repo with a confusing 404.
          token: ${{ secrets.INFRA_REPO_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: wallet-service/go.sum

      - name: Verify formatting
        working-directory: wallet-service
        run: |
          unformatted=$(gofmt -s -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify the module graph
        working-directory: wallet-service
        run: |
          go mod verify
          go mod tidy
          # A dirty go.mod after tidy means the committed dependency set does not match
          # the imports, which is how a build starts working only on one machine.
          git diff --exit-code go.mod go.sum

      - name: Vet
        working-directory: wallet-service
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1

      - name: Static analysis
        working-directory: wallet-service
        run: staticcheck ./...

      - name: Unit tests with the race detector
        working-directory: wallet-service
        # -race is not optional for this service: the whole design rests on concurrent
        # money movement being safe, and a data race in a fake would invalidate the
        # tests that prove it.
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: wallet-service
        run: go tool cover -func=coverage.out | tail -40

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-wallet-service
          path: wallet-service/coverage.out
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Real Postgres, because the properties under test — FOR UPDATE row locks, the
    # append-only ledger trigger, the CHECK constraints — do not exist in a fake.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arcadia
          POSTGRES_PASSWORD: arcadia
          POSTGRES_DB: arcadia_wallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arcadia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the service
        uses: actions/checkout@v4
        with:
          path: wallet-service

      - name: Check out the shared platform module
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/infra
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: wallet-service/go.sum

      - name: Run integration tests
        working-directory: wallet-service
        env:
          TEST_DATABASE_URL: postgres://arcadia:arcadia@localhost:5432/arcadia_wallet?sslmode=disable
        run: go test -race -count=1 -tags=integration ./test/...

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: [verify, integration]
    # Images are published from main and from tags only. A pull request gets its image
    # built — to prove the Dockerfile still works — but never pushed.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the service
        uses: actions/checkout@v4
        with:
          path: wallet-service

      - name: Check out the shared platform module
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/infra
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The context is the parent of both checkouts, because the Dockerfile copies
          # the platform module from the sibling directory.
          context: .
          file: wallet-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Load the image locally on a pull request so the scan below has something to
          # look at even when nothing was pushed.
          load: ${{ github.event_name == 'pull_request' }}

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          format: table
          # A wallet image with a known critical CVE does not ship. Lower severities are
          # reported but do not block, so the gate stays credible rather than being
          # routinely bypassed.
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Generate an SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          artifact-name: sbom-wallet-service.spdx.json
